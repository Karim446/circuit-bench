name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: |
          for f in $(find public functions tests -name '*.js'); do
            case "$f" in functions/*) continue;; esac
            node --check "$f"
          done
      - name: Question generator smoke test
        run: node tests/smoke.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the database id is filled in
        run: |
          if grep -q 'PASTE-YOUR-DATABASE-ID-HERE' wrangler.toml; then
            echo "::error::wrangler.toml still has the placeholder database_id. Paste your real D1 database id and push again."
            exit 1
          fi
      # Cloudflare only publishes to the live address when the deploy is tagged with the project's
      # production branch. Ask Cloudflare what that is instead of assuming "main".
      - name: Find the Pages production branch
        id: prod
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          name=$(grep -m1 '^name' wrangler.toml | cut -d'"' -f2)
          resp=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$name")
          branch=$(echo "$resp" | jq -r '.result.production_branch // empty')
          if [ -z "$branch" ]; then
            echo "::error::Could not read the production branch of Pages project '$name': $(echo "$resp" | jq -c '.errors')"
            exit 1
          fi
          echo "Production branch of '$name' is '$branch'"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=${{ steps.prod.outputs.branch }}
