name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: |
          for f in $(find public functions tests -name '*.js'); do
            case "$f" in functions/*) continue;; esac
            node --check "$f"
          done
      - name: Question generator smoke test
        run: node tests/smoke.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the database id is filled in
        run: |
          if grep -q 'PASTE-YOUR-DATABASE-ID-HERE' wrangler.toml; then
            echo "::error::wrangler.toml still has the placeholder database_id. Paste your real D1 database id and push again."
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
