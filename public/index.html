<style>
:root{--paper:#F6F8FA;--grid:#E3E9EF;--grid2:#CCD8E3;--ink:#1C2B3A;--ink2:#566778;--line:#BCC9D5;--probe:#C8202A;--hl:#B3DFF7;--ok:#1E7A55;--okbg:#E1F2E9;--badbg:#FBE6E6;--lcd:#C4CEAB;--lcdink:#1F2B17;--panel:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--paper:#12171D;--grid:#19212A;--grid2:#232E39;--ink:#DDE6EE;--ink2:#97A8B8;--line:#33414E;--probe:#FF5C61;--hl:#1D5576;--ok:#5BC79A;--okbg:#15322A;--badbg:#3A1C1F;--lcd:#2B3423;--lcdink:#D3EAB0;--panel:#171D24}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:17px;line-height:1.55;font-feature-settings:"tnum"}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--probe);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:26px 22px;background:var(--panel)}
main{padding:30px clamp(16px,4vw,52px) 64px;max-width:920px;width:100%}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;margin:0;line-height:1}
.tag{color:var(--ink2);font-size:15px;margin:6px 0 24px}
aside h2{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--ink2)}
.topic{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:15.5px}
.topic input{width:17px;height:17px;accent-color:var(--ink);margin:0}
.topic .ct{color:var(--ink2);font-size:13.5px}
.bar{grid-column:2/4;height:4px;background:var(--grid2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;gap:10px;align-items:center;font-size:15.5px;padding:6px 0;cursor:pointer}
.toggle input{width:17px;height:17px;accent-color:var(--ink);margin:0}
.linkish{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:14px}
.score{display:flex;gap:18px;font-size:15px;color:var(--ink2);margin:0 0 18px;flex-wrap:wrap}
.score b{color:var(--ink);font-weight:600}
.meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:14.5px;color:var(--ink2)}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--panel)}
.pill.diagnose{border-color:var(--probe);color:var(--probe)}
h3.qt{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:600;margin:0 0 14px;line-height:1.15}
.sheet{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:16px 16px,16px 16px,80px 80px,80px 80px;border:1px solid var(--line);border-radius:6px;padding:6px;margin-bottom:16px}
.sheet svg{width:100%;height:auto;display:block;max-height:400px}
svg .sw{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .thick{stroke-width:3}
svg .sf,svg .sd{fill:var(--ink)}
svg .st{fill:var(--paper);stroke:var(--ink);stroke-width:2}
svg text{font-family:'Barlow',sans-serif;fill:var(--ink)}
svg .sn{font-weight:600;font-size:15px}
svg .sv{font-size:14px;fill:var(--ink2)}
svg .spm{font-size:15px;font-weight:700}
svg .pl{stroke:var(--probe);stroke-width:1.5}
svg .pd{fill:var(--probe)}
svg .pb{fill:var(--panel);stroke:var(--probe);stroke-width:1.5}
svg .pt{font-size:13.5px;font-weight:600;fill:var(--probe)}
svg .bx{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.prompt{max-width:68ch;margin:0 0 18px}
.prompt p{margin:0 0 10px}
.prompt ul{margin:4px 0 10px;padding-left:20px}
.answer{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.meter{background:#2A3038;border:5px solid #E2B11E;border-radius:16px;padding:9px}
.dmm{display:flex;align-items:baseline;gap:8px;background:var(--lcd);color:var(--lcdink);border-radius:7px;padding:4px 14px 6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}

.hbtn.synced::after,.hbtn.syncerr::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--panel)}
.hbtn.syncerr::after{background:var(--probe)}
.sp-h{margin:12px 0 6px;font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.sp-p{margin:0 0 8px;font-size:14.5px;line-height:1.45}
.sp-code{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.sp-code code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;letter-spacing:.04em}
.sp-code input{flex:1;min-width:0;padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
#syncp .btn{font-size:14.5px;padding:7px 14px}
/* ---- terminal ---- */
.shtask{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 16px;margin:0 0 14px}
.shtask .tools .btn{font-size:14.5px;padding:6px 12px}
.shcmd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--grid);padding:2px 6px;border-radius:4px}
.term{background:#0F151B;color:#D7E3EC;border-radius:10px;padding:12px 14px;height:min(58vh,560px);overflow-y:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.45;cursor:text;border:1px solid #233140}
.term pre.tl{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.term pre.cmd{color:#8FD3FF}
.term pre.err{color:#FF8A8F}
.term pre.note{color:#9FB2C2;font-style:italic}
.term-line{display:flex;gap:8px;align-items:baseline}
.term-ps{color:#7EE2A8;white-space:nowrap}
.term-line input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#F2F7FA;font:inherit;caret-color:#7EE2A8;padding:0}
/* ---- transient ---- */
#simPlotBox{margin-top:12px}
.tr-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:4px 2px 0}
.tr-legend i,.tr-dot{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tr-dot{width:10px;height:10px;border-radius:50%}
.wave{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:0 0 8px;transition:background .3s}
.wave.flash{background:var(--hl)}
.wave .seg button{font-size:13px;padding:3px 8px}
.wave-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.wave-grid label{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.wave-grid input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px}
.simbar .seg button{font-size:15px;padding:6px 12px}

.pylesson .term pre.tl{background:transparent;border:0;padding:0;border-radius:0;overflow:visible;font-size:14px;line-height:1.45}
.pylesson .term pre.tl:not(.cmd):not(.err):not(.note){color:#D7E3EC}

<script>
"use strict";
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
function res(lo,hi){const o=[];for(let e=0;e<=6;e++)for(const m of E12){const v=+(m*10**e).toPrecision(3);if(v>=lo&&v<=hi)o.push(v);}return o.length?pick(o):nearE12((lo+hi)/2);}
const sig=(x,n=3)=>+(+x).toPrecision(n);
function eng(v,unit,n=3){if(!isFinite(v)||Math.abs(v)<1e-15)return `0 ${unit}`;const P={'-12':'p','-9':'n','-6':'µ','-3':'m','0':'','3':'k','6':'M','9':'G'};let e=Math.floor(Math.log10(Math.abs(v))/3)*3;e=Math.max(-12,Math.min(9,e));let m=sig(v/10**e,n);if(Math.abs(m)>=1000&&e<9){e+=3;m=sig(v/10**e,n);}return `${m} ${P[e]}${unit}`;}
const ohm=v=>eng(v,'Ω');
const f2=(v,d=2)=>String(+v.toFixed(d));
const capv=v=>eng(v,'F');
const num=(value,unit,o={})=>({type:'num',value,unit,tol:o.tol??0.03,abs:o.abs??0});
function mc(correct,wrongs){const opts=shuffle([correct,...wrongs]);return{type:'mc',options:opts,correct:opts.indexOf(correct)};}
const hl=s=>`<span class="hl">${s}</span>`;

/* ---------- schematic drawing ---------- */
const BODIES={
 res:'<path class="sw" d="M-20 0 L-17.5 -7 L-12.5 7 L-7.5 -7 L-2.5 7 L2.5 -7 L7.5 7 L12.5 -7 L17.5 7 L20 0"/>',
 cap:'<path class="sw" d="M-20 0 H-4 M20 0 H4"/><path class="sw thick" d="M-4 -12 V12 M4 -12 V12"/>',
 diode:'<path class="sw" d="M-20 0 H-8 M8 0 H20 M8 -10 V10"/><path class="sf" d="M-8 -10 L8 0 L-8 10 Z"/>',
 zener:'<path class="sw" d="M-20 0 H-8 M8 0 H20 M4 -13 L8 -10 V10 L12 13"/><path class="sf" d="M-8 -10 L8 0 L-8 10 Z"/>',
 led:'<path class="sw" d="M-20 0 H-8 M8 0 H20 M8 -10 V10 M-1 -12 L5 -20 M6 -10 L12 -18"/><path class="sf" d="M-8 -10 L8 0 L-8 10 Z M5.5 -21 L0.5 -19.2 L3.6 -16.6 Z M12.5 -19 L7.5 -17.2 L10.6 -14.6 Z"/>',
 photo:'<path class="sw" d="M-20 0 H-8 M8 0 H20 M8 -10 V10 M-9 -25 L-3 -16 M-2 -27 L4 -18"/><path class="sf" d="M-8 -10 L8 0 L-8 10 Z M-2.6 -14.6 L-3.7 -19.8 L-6.6 -17.6 Z M4.4 -16.6 L3.3 -21.8 L0.4 -19.6 Z"/>',
 coil:'<path class="sw" d="M-20 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/>',
 sw:'<path class="sw" d="M-20 0 H-12 M12 0 H20 M-8 -2 L10 -13"/><circle class="st" cx="-10" cy="0" r="2.6"/><circle class="st" cx="10" cy="0" r="2.6"/>',
 src:'<circle class="sw" cx="0" cy="0" r="17"/>',
 isrc:'<circle class="sw" cx="0" cy="0" r="17"/><path class="sw" d="M-9 0 H5"/><path class="sf" d="M10 0 L2 -5.5 L2 5.5 Z"/>',
};

/* ---------- subscripts (V_in, V_out, …) ---------- */
const SUBTOK=(svg)=>new RegExp(`\\b(?:(V)(in|out|th|ref|cc|DD|CE|BE|GS|DS|IH|IL|OH|OL|rms|pk|pp|avg|z|f|s|c|d)|(R)(in|IN|out|th|L|B|F|G|S|PU|PD|DS${svg?'|C':''})|(I)(in|out|c|b|e|E|L|z|ph|d|sink)|(f)(c)|(X)(c|C|L)|([VRI])_([A-Za-z]+))(\\((?:th|on|sat|max|min)\\))?(?![A-Za-z0-9])`,'g');
const SUB_H=SUBTOK(false),SUB_S=SUBTOK(true);
function subParts(m){const a=[...m];for(let i=1;i<=11;i+=2)if(a[i])return[a[i],a[i+1]+(a[13]||'')];return[m[0],''];}
function svgSub(t){t=String(t);let out='',last=0,open=0;SUB_S.lastIndex=0;let m;
 while((m=SUB_S.exec(t))){const[b,sb]=subParts(m);out+=t.slice(last,m.index)+`${b}<tspan dy="3.5" style="font-size:72%">${sb}</tspan><tspan dy="-3.5">`;open++;last=m.index+m[0].length;}
 return out+t.slice(last)+'</tspan>'.repeat(open);}
function subify(root){if(!root||typeof document==='undefined')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('svg,script,style,pre,code,textarea,sub'))return NodeFilter.FILTER_REJECT;SUB_H.lastIndex=0;return SUB_H.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const t=n.nodeValue,f=document.createDocumentFragment();let last=0,m;SUB_H.lastIndex=0;
  while((m=SUB_H.exec(t))){const[b,sb]=subParts(m);f.append(t.slice(last,m.index)+b);const e=document.createElement('sub');e.textContent=sb;f.append(e);last=m.index+m[0].length;}
  f.append(t.slice(last));n.replaceWith(f);});}
let LAST_SCH=null;
class Sch{
 constructor(w=520,h=310){this.w=w;this.h=h;this.o=[];this.N={wires:[],comps:[],rails:[],terms:[],gnds:[],dots:[],probes:[],ops:[],bjts:[],fets:[],unsupported:false};}
 add(s){this.o.push(s);return this;}
 wire(...p){this.N.wires.push(p.map(q=>[q[0],q[1]]));return this.add(`<polyline class="sw" points="${p.map(q=>q.join(',')).join(' ')}"/>`);}
 dot(x,y){this.N.dots.push([x,y]);return this.add(`<circle class="sd" cx="${x}" cy="${y}" r="3.3"/>`);}
 text(x,y,t,c='sv',a='middle'){return this.add(`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${svgSub(t)}</text>`);}
 gnd(x,y){this.N.gnds.push([x,y]);return this.add(`<path class="sw" d="M${x} ${y} v10 M${x-12} ${y+10} h24 M${x-7} ${y+15} h14 M${x-3} ${y+20} h6"/>`);}
 rail(x,y,label,o={}){this.N.rails.push({p:[x,y],label,v:o.v});this.add(`<path class="sw" d="M${x} ${y} v-10 M${x-10} ${y-10} h20"/>`);return this.text(x,y-16,label,'sn');}
 term(x,y,label,side='left',o={}){this.N.terms.push({p:[x,y],label,v:o.v});this.add(`<circle class="st" cx="${x}" cy="${y}" r="4"/>`);if(side==='left')return this.text(x-10,y+5,label,'sn','end');if(side==='right')return this.text(x+10,y+5,label,'sn','start');return this.text(x,y-11,label,'sn');}
 probe(x,y,tag,reading,dx=26,dy=-26){this.N.probes.push({p:[x,y],tag,reading});const tx=x+dx,ty=y+dy;this.add('<g class="probe">');this.add(`<line class="pl" x1="${x}" y1="${y}" x2="${tx}" y2="${ty}"/><circle class="pd" cx="${x}" cy="${y}" r="4.5"/>`);const label=reading!=null?`${tag} = ${reading}`:tag;const w=label.length*7.3+16;const bx=dx===0?tx-w/2:(dx>0?tx:tx-w);this.add(`<rect class="pb" x="${bx}" y="${ty-11}" width="${w}" height="21" rx="4"/>`);this.text(bx+w/2,ty+4.5,label,'pt');return this.add('</g>');}
 two(type,a,b,name='',val='',opt={}){
  this.N.comps.push({type,a:[a[0],a[1]],b:[b[0],b[1]],name,val,opt});
  const[x1,y1]=a,[x2,y2]=b,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const half=type==='src'||type==='isrc'?17:20,cx=(x1+x2)/2,cy=(y1+y2)/2,ang=Math.atan2(dy,dx)*180/Math.PI;
  this.add(`<line class="sw" x1="${x1}" y1="${y1}" x2="${cx-ux*half}" y2="${cy-uy*half}"/><line class="sw" x1="${cx+ux*half}" y1="${cy+uy*half}" x2="${x2}" y2="${y2}"/>`);
  this.add(`<g transform="translate(${cx} ${cy}) rotate(${ang})">${BODIES[type]}</g>`);
  if(type==='src'){this.text(cx+ux*8,cy+uy*8+5,'+','spm');this.text(cx-ux*8,cy-uy*8+5,'−','spm');}
  const horiz=Math.abs(dy)<Math.abs(dx);
  if(horiz){if(name)this.text(cx,cy-17,name,'sn');if(val)this.text(cx,cy+28,val,'sv');}
  else{const s=opt.left?-1:1,an=opt.left?'end':'start',ox=cx+s*(type==='src'||type==='isrc'?25:(type==='led'||type==='photo'||type==='zener'?24:17));if(name)this.text(ox,cy-3,name,'sn',an);if(val)this.text(ox,cy+14,val,'sv',an);}
  return this;}
 opamp(x,y,plusTop=false,o={}){
  this.N.ops.push({x,y,top:[x-32,y-16],bot:[x-32,y+16],out:[x+36,y],plusTop,vp:o.vp??12,vn:o.vn??-12});
  this.add(`<path class="sw" d="M${x-32} ${y-36} L${x-32} ${y+36} L${x+36} ${y} Z"/>`);
  this.text(x-23,y-11,plusTop?'+':'−','spm');this.text(x-23,y+21,plusTop?'−':'+','spm');
  return{top:[x-32,y-16],bot:[x-32,y+16],out:[x+36,y]};}
 npn(x,y,name='Q1',o={}){
  this.N.bjts.push({x,y,b:[x-26,y],c:[x+10,y-36],e:[x+10,y+36],name,beta:o.beta??100});
  const tip=[x+7,y+17.7],d=[18/22.8,14/22.8],n=[-d[1],d[0]];
  const p1=[tip[0]-7*d[0]+4*n[0],tip[1]-7*d[1]+4*n[1]],p2=[tip[0]-7*d[0]-4*n[0],tip[1]-7*d[1]-4*n[1]];
  this.add(`<path class="sw" d="M${x-26} ${y} H${x-8} M${x-8} ${y-6} L${x+10} ${y-20} V${y-36} M${x-8} ${y+6} L${x+10} ${y+20} V${y+36}"/><path class="sw thick" d="M${x-8} ${y-15} V${y+15}"/><path class="sf" d="M${tip[0]} ${tip[1]} L${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]} Z"/>`);
  this.text(x+18,y+5,name,'sn','start');
  return{b:[x-26,y],c:[x+10,y-36],e:[x+10,y+36]};}
 nmos(x,y,name='Q1',o={}){
  this.N.fets.push({x,y,g:[x-28,y],d:[x+10,y-36],s:[x+10,y+36],name:name||'Q1',vth:o.vth??1.5,vfull:o.vfull??2.5,ron:o.ron??0.05});
  this.add(`<path class="sw" d="M${x-28} ${y} H${x-12} M${x-12} ${y-16} V${y+16} M${x-6} ${y-13} H${x+10} V${y-36} M${x-6} ${y+13} H${x+10} V${y+36} M${x-6} ${y} H${x+10} V${y+13}"/><path class="sw thick" d="M${x-6} ${y-19} V${y-8} M${x-6} ${y-5} V${y+5} M${x-6} ${y+8} V${y+19}"/><path class="sf" d="M${x-5} ${y} L${x+3} ${y-4} L${x+3} ${y+4} Z"/>`);
  this.text(x+18,y+5,name,'sn','start');
  return{g:[x-28,y],d:[x+10,y-36],s:[x+10,y+36]};}
 box(x,y,w,h,label,sub=''){this.N.unsupported=true;this.add(`<rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/>`);this.text(x+w/2,y+h/2+(sub?-3:5),label,'sn');if(sub)this.text(x+w/2,y+h/2+15,sub,'sv');return this;}
 svg(desc='Circuit schematic'){LAST_SCH=this;return `<svg viewBox="0 0 ${this.w} ${this.h}" role="img" aria-label="${desc}">${this.o.join('')}</svg>`;}
}
function nearE12(x){let best=1,bd=1e99;for(let e=-1;e<=7;e++)for(const m of E12){const v=+(m*10**e).toPrecision(3);const d=Math.abs(Math.log(v/x));if(d<bd){bd=d;best=v;}}return best;}
function e12Up(x){for(let e=-1;e<=7;e++)for(const m of E12){const v=+(m*10**e).toPrecision(3);if(v>=x*0.999)return v;}return x;}
function e12Down(x){let b=null;for(let e=-1;e<=7;e++)for(const m of E12){const v=+(m*10**e).toPrecision(3);if(v<=x*1.001)b=v;}return b??x;}
/* ---------- topics ---------- */
const TOPICS=[
 {id:'dc',name:'DC fundamentals'},
 {id:'diode',name:'Diodes & LEDs'},
 {id:'xstr',name:'Transistor switches'},
 {id:'opamp',name:'Op-amps'},
 {id:'rc',name:'RC circuits & filters'},
 {id:'ac',name:'Signals, AC & dB'},
 {id:'digital',name:'Digital interfacing'},
 {id:'power',name:'Power'},
 {id:'meas',name:'Measurement technique'},
 {id:'portfolio',name:'Your portfolio circuits'}];
const FORMULAS={
 dc:['V = I·R','P = V·I = I²R = V²/R; keep P under ~50% of the rating','Series: R = R1 + R2;  parallel: R1R2/(R1+R2)','Divider: Vout = Vin·R2/(R1+R2)','Loaded divider: replace R2 with R2‖RL','Thevenin of a divider: Vth = open-circuit Vout, Rth = R1‖R2','KCL: currents into a node sum to zero. KVL: voltages around a loop sum to zero','Current divider: I1 = Itotal·R2/(R1 + R2)'],
 diode:['Silicon ≈ 0.7 V; red LED ≈ 2.0 V; green ≈ 2.2 V; blue/white ≈ 3.0–3.1 V','LED resistor: R = (Vs − Vf) / I, round up to a standard value','Reverse biased → no current (LED reverse rating is only ~5 V)','Zener regulator: Is = (Vs − Vz)/Rs, Iz = Is − IL; check it regulates: Vs·RL/(Rs+RL) > Vz','Flyback diode: across the coil, cathode to +V'],

function divSch(V,R1,R2,o={}){
 const s=new Sch(520,300);
 s.two('src',[90,240],[90,70],'',`${V} V`,{left:true});
 s.wire([90,70],[260,70]);
 s.two('res',[260,70],[260,155],'R1',ohm(R1));
 s.two('res',[260,155],[260,240],'R2',o.hideR2?'?':ohm(R2));
 s.wire([90,240],[260,240]);s.gnd(175,240);
 if(o.RL){s.wire([260,155],[390,155]);s.two('res',[390,155],[390,240],'RL',ohm(o.RL));s.wire([260,240],[390,240]);s.dot(260,155);s.dot(260,240);}
 else{s.wire([260,155],[340,155]);s.term(340,155,'Vout','right');s.dot(260,155);}
 return s;}
function ledSch(V,rlab,o={}){
 const s=new Sch(520,290),t=o.diode?'diode':'led',n=o.diode?'D1':'LED1';
 s.two('src',[80,240],[80,70],'',`${V} V`,{left:true});s.wire([80,70],[140,70]);s.two('res',[140,70],[260,70],'R1',rlab,{sv:o.sv});s.wire([260,70],[350,70]);
 if(o.reversed)s.two(t,[350,240],[350,70],n,'',{vf:o.vf});else s.two(t,[350,70],[350,240],n,'',{vf:o.vf});
 s.wire([350,240],[80,240]);s.gnd(215,240);return s;}
function bjtSch(vinLab,rbLab,load){
 const s=new Sch(520,320);s.rail(330,40,'+12 V');
 const q=s.npn(320,250,'Q1',{beta:load.beta??100});
 if(load.led){s.two('res',[330,40],[330,125],'RC',load.lab);s.two('led',[330,125],q.c,'LED1');}
 else s.two('res',[330,40],q.c,'RC',load.lab);
 s.gnd(q.e[0],q.e[1]);s.term(100,250,vinLab,'left');s.wire([100,250],[130,250]);s.two('res',[130,250],[250,250],'RB',rbLab,{sv:load.rbv});s.wire([250,250],q.b);
 return{s,q};}
function nmosSch(o){
 const s=new Sch(520,340);s.rail(330,40,`+${o.V||12} V`);const q=s.nmos(320,250,'Q1',o.fet||{});
 if(o.led){s.two('res',[330,40],[330,120],'R1',o.lab||'');s.two('led',[330,120],q.d,'LED1');}
 else s.two('res',[330,40],q.d,'Load',o.lab||'',{sv:o.lsv});
 s.gnd(q.s[0],q.s[1]);s.term(80,250,'GPIO','left',{v:o.vg??3.3});s.wire([80,250],[110,250]);s.two('res',[110,250],[200,250],'RG','100 Ω');s.wire([200,250],q.g);
 if(o.pd){s.dot(250,250);s.two('res',[250,250],[250,310],'RPD','100 kΩ',{left:true});s.gnd(250,310);}
 return{s,q};}
function flySch(withD){
 const s=new Sch(520,330);s.rail(330,40,'+12 V');s.wire([330,40],[330,70]);s.two('coil',[330,70],[330,190],'K1','relay coil',{left:true});
 if(withD){s.wire([330,70],[410,70]);s.two('diode',[410,190],[410,70],'D1','');s.wire([410,190],[330,190]);s.dot(330,70);s.dot(330,190);}

function invSch(Rin,Rf,o={}){
 const s=new Sch(520,280),p=s.opamp(330,170,false);
 if(o.tia){s.two('photo',[190,250],[190,154],'PD1','',{left:true,iph:o.iph});s.gnd(190,250);s.wire([190,154],[250,154]);s.dot(190,154);}

 s.wire(p.out,[455,170]);s.dot(420,170);s.term(455,170,'Vout','right');s.wire(p.bot,[280,186],[280,215]);s.gnd(280,215);return{s,p};}

 s.term(90,154,'Vin','left',{v:vin});s.wire([90,154],p.top);s.wire(p.bot,[260,186],[260,250]);s.dot(260,250);

 s.two('res',[260,250],[260,315],'RG',ohm(Rg),{left:true});s.gnd(260,315);s.wire(p.out,[455,170]);s.dot(420,170);s.term(455,170,'Vout','right');return{s,p};}
function puSch(rlab,clab,o={}){
 const s=new Sch(520,350);s.rail(300,40,'+3.3 V');s.two('res',[300,40],[300,140],'RPU',rlab,{sv:o.rv});s.wire([300,140],[440,140]);s.term(440,140,'MCU in','right');
 s.dot(300,140);s.dot(380,140);s.two('cap',[380,140],[380,240],'C line',clab);s.gnd(380,240);
 const q=s.nmos(290,276,'');s.wire([300,140],q.d);s.gnd(q.s[0],q.s[1]);s.term(190,276,o.drv||'driver','left',{v:0});s.wire([190,276],q.g);return s;}
function lsiSch(R1,R2,Vz,o={}){
 const s=new Sch(520,340),p=s.opamp(330,170,true,{vp:5,vn:0});
 s.rail(90,60,'Vs',{v:o.vs??9});s.two('res',[90,60],[90,230],'R1',o.hideR1?'?':ohm(R1),{left:true,sv:R1});s.dot(90,230);s.two('res',[90,230],[90,305],'R2',ohm(R2),{left:true});s.gnd(90,305);
 s.wire([90,230],[270,230],[270,186],p.bot);
 s.rail(210,40,'+5 V');s.two('res',[210,40],[210,110],'R3','',{sv:1000});s.dot(210,110);s.two('zener',[210,180],[210,110],'Z1',`${Vz} V`,{left:true});s.gnd(210,180);
 s.wire([210,110],[260,110],[260,154],p.top);
 s.wire(p.out,[376,170]);s.two('res',[376,170],[456,170],'R4','',{sv:330});s.wire([456,170],[480,170]);s.two('led',[480,170],[480,262],'LED',' ',{left:true});s.gnd(480,262);
 return{s,p};}

const PFX={p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,m:1e-3,'':1,k:1e3,M:1e6,G:1e9};
function parseVal(str){if(str==null)return NaN;const m=String(str).match(/(-?\d*\.?\d+)\s*([pnuµmkMG]?)/);return m?parseFloat(m[1])*PFX[m[2]||'']:NaN;}
const pkey=p=>`${Math.round(p[0]*2)/2},${Math.round(p[1]*2)/2}`;
function onSeg(p,a,b){const cr=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);if(Math.abs(cr)>0.8*Math.hypot(b[0]-a[0],b[1]-a[1]))return false;return p[0]>=Math.min(a[0],b[0])-.6&&p[0]<=Math.max(a[0],b[0])+.6&&p[1]>=Math.min(a[1],b[1])-.6&&p[1]<=Math.max(a[1],b[1])+.6;}
/* Build connectivity, device list, and net names from a recorded schematic */
function extract(N){
 const par={},find=k=>{while(par[k]!==k){par[k]=par[par[k]];k=par[k];}return k;},add=k=>{if(!(k in par))par[k]=k;},uni=(a,b)=>{add(a);add(b);const x=find(a),y=find(b);if(x!==y)par[x]=y;};
 const pts=[],P=p=>{add(pkey(p));pts.push(p);};
 N.comps.forEach(c=>{P(c.a);P(c.b);});N.ops.forEach(o=>{P(o.top);P(o.bot);P(o.out);});N.bjts.forEach(q=>{P(q.b);P(q.c);P(q.e);});N.fets.forEach(q=>{P(q.g);P(q.d);P(q.s);});
 N.rails.forEach(r=>P(r.p));N.terms.forEach(t=>P(t.p));N.gnds.forEach(g=>P(g));N.probes.forEach(q=>P(q.p));N.dots.forEach(d=>P(d));N.wires.forEach(w=>w.forEach(P));
 N.wires.forEach(w=>{for(let i=0;i<w.length-1;i++){uni(pkey(w[i]),pkey(w[i+1]));for(const p of pts)if(onSeg(p,w[i],w[i+1]))uni(pkey(p),pkey(w[i]));}});
 add('GND');N.gnds.forEach(g=>uni(pkey(g),'GND'));
 const root=p=>find(pkey(p)),G0=find('GND');
 const nets=new Map();const net=r=>{if(!nets.has(r))nets.set(r,{root:r,name:null,gnd:r===G0,labels:[],pts:[]});return nets.get(r);};
 N.rails.forEach(r=>net(root(r.p)).labels.push(r.label.replace(/\s/g,'')));
 N.terms.forEach(t=>{const n=net(root(t.p));const l=t.label.replace(/\s*=.*$/,'').replace(/\s+/g,'_');n.labels.push(l);});
 const allPts=[...N.probes.map(q=>q.p),...N.terms.map(t=>t.p),...N.dots,...N.wires.flat(),...pts];
 allPts.forEach(p=>net(root(p)).pts.push(p));
 let k=1;[...nets.values()].forEach(n=>{n.name=n.gnd?'0':(n.labels[0]||`N${k++}`);});
 const used=new Set();[...nets.values()].forEach(n=>{let nm=n.name,i=2;while(used.has(nm)&&!n.gnd)nm=n.name+'_'+i++;n.name=nm;used.add(nm);});
 return{root,G0,nets,nameOf:p=>nets.get(root(p))?.name??'?'};
}
/* Device list with values; faults: {ref:{mode:'open'|'short'}}, vals:{ref:number|bool} */
function devices(N){
 const D=[];
 N.comps.forEach((c,i)=>{const ref='c'+i;let v=c.opt.sv??parseVal(c.val);
  const d={ref,type:c.type,name:c.name||c.type.toUpperCase(),label:c.val,a:c.a,b:c.b,src:c};
  if(c.type==='res'){d.value=v;d.unit='Ω';}
  else if(c.type==='src'){d.value=v;d.unit='V';}
  else if(c.type==='cap'){d.value=v;d.unit='F';}
  else if(c.type==='led'){d.value=c.opt.vf??2.0;d.unit='V (Vf)';}
  else if(c.type==='diode'){d.value=0.7;d.unit='V (Vf)';}
  else if(c.type==='zener'){d.value=isFinite(v)?v:5.1;d.unit='V (Vz)';}
  else if(c.type==='isrc'){d.value=v;d.unit='A';}
  else if(c.type==='photo'){d.value=c.opt.iph??0;d.unit='A';}
  else if(c.type==='sw'){d.value=!!c.opt.closed;d.unit='';}
  else if(c.type==='coil'){d.value=0;d.unit='';}
  D.push(d);});

const LESSONS=[
{id:'dc',sub:'Ohm, Kirchhoff, dividers, Thevenin, power',lead:'Everything else in this course is built on these five ideas. Get them automatic and the rest becomes pattern matching.',sections:[
 {h:'Voltage, current and resistance',html:`<p><b>Voltage</b> is the push that moves charge, measured in volts (V). It is always measured <i>between</i> two points; when someone says “the node is at 3 V” they mean 3 V relative to ground. <b>Current</b> is the flow of charge, in amps (A). Current is the same everywhere along a single unbranched path. <b>Resistance</b> opposes current, in ohms (Ω).</p><p>A water analogy works well: voltage is pressure, current is flow rate, resistance is how narrow the pipe is.</p><table><tr><th>Prefix</th><th>Factor</th><th>Example</th></tr><tr><td>M (mega)</td><td>10⁶</td><td>1 MΩ</td></tr><tr><td>k (kilo)</td><td>10³</td><td>4.7 kΩ</td></tr><tr><td>m (milli)</td><td>10⁻³</td><td>20 mA</td></tr><tr><td>µ (micro)</td><td>10⁻⁶</td><td>10 µF</td></tr><tr><td>n (nano)</td><td>10⁻⁹</td><td>100 nF</td></tr><tr><td>p (pico)</td><td>10⁻¹²</td><td>22 pF</td></tr></table>`},
 {h:'Ohm’s law',html:`<p class="key"><b>V = I × R.</b> Rearranged: I = V/R and R = V/I. Mental anchor: 1 V across 1 kΩ is 1 mA. Volts divided by kilohms gives milliamps directly.</p>`,
  w:()=>({controls:[{id:'V',label:'Supply',min:0,max:24,step:0.5,val:5,fmt:fmtV},{id:'R',label:'Resistance',min:10,max:100000,val:1000,log:1,fmt:fmtR}],
   render:v=>{const s=new Sch(520,280);s.two('src',[110,230],[110,70],'',`${v.V} V`,{left:true});s.wire([110,70],[330,70]);s.two('res',[330,70],[330,230],'R',ohm(v.R));s.wire([330,230],[110,230]);s.gnd(220,230);
    return fitTag(s.svg())+ro([['I = V/R',fmtI(v.V/v.R)],['P = V²/R',eng(v.V*v.V/v.R,'W')]]);}})},
 {h:'Series and parallel',html:`<p><b>Series</b> parts carry the same current, so resistances add: R = R1 + R2. <b>Parallel</b> parts share the same voltage, so currents add and the combination is <i>smaller than the smallest</i>: R = R1·R2/(R1 + R2). Two equal resistors in parallel give half the value.</p>`,
  w:()=>({controls:[{id:'m',label:'Connection',type:'seg',options:[['s','Series'],['p','Parallel']],val:'p'},{id:'a',label:'R1',min:100,max:100000,val:1000,log:1,fmt:fmtR},{id:'b',label:'R2',min:100,max:100000,val:4700,log:1,fmt:fmtR}],
   render:v=>{const s=new Sch(520,290),V=10;s.two('src',[80,240],[80,70],'','10 V',{left:true});let Req;
    if(v.m==='s'){s.wire([80,70],[120,70]);s.two('res',[120,70],[240,70],'R1',ohm(v.a));s.wire([240,70],[340,70]);s.two('res',[340,70],[340,240],'R2',ohm(v.b));s.wire([340,240],[80,240]);Req=v.a+v.b;}
    else{s.wire([80,70],[360,70]);s.two('res',[240,70],[240,240],'R1',ohm(v.a));s.two('res',[360,70],[360,240],'R2',ohm(v.b));s.wire([360,240],[80,240]);s.dot(240,70);s.dot(240,240);Req=v.a*v.b/(v.a+v.b);}
    s.gnd(160,240);const I=V/Req;
    return fitTag(s.svg())+ro(v.m==='s'?[['Req',ohm(Req)],['I',fmtI(I)],['V(R1)',fmtV(I*v.a)],['V(R2)',fmtV(I*v.b)]]:[['Req',ohm(Req)],['I total',fmtI(I)],['I(R1)',fmtI(V/v.a)],['I(R2)',fmtI(V/v.b)]]);}})},
 {h:'Kirchhoff’s laws',html:`<p><b>KCL (current law):</b> the current flowing into a node equals the current flowing out. Nothing piles up. <b>KVL (voltage law):</b> around any closed loop, the voltage rises equal the voltage drops. In a series string, the drops add up to exactly the supply. On the bench, KVL tells you where the voltage “went”: if one part has almost the whole supply across it, that part is probably open.</p>`,
  w:()=>({controls:[{id:'V',label:'Supply',min:1,max:24,step:0.5,val:12,fmt:fmtV},{id:'a',label:'R1',min:100,max:10000,val:1000,log:1,fmt:fmtR},{id:'b',label:'R2',min:100,max:10000,val:2200,log:1,fmt:fmtR},{id:'c',label:'R3',min:100,max:10000,val:470,log:1,fmt:fmtR}],
   render:v=>{const I=v.V/(v.a+v.b+v.c),d=[v.a,v.b,v.c].map(r=>I*r),W=520;let x=40,g='';const cl=['var(--ink)','var(--ink2)','var(--probe)'];
    d.forEach((vd,i)=>{const w=(W-80)*vd/v.V;g+=`<rect x="${x}" y="40" width="${w}" height="44" style="fill:${cl[i]};opacity:.85"/><text class="ptk" x="${x+w/2}" y="104" text-anchor="middle">R${i+1}: ${f2(vd)} V</text>`;x+=w;});
    return `<svg viewBox="0 0 ${W} 130"><text class="ptk" x="40" y="28">Drops around the loop (they always fill the whole ${v.V} V)</text>${g}</svg>`+ro([['Loop current',fmtI(I)],['Sum of drops',fmtV(d.reduce((a,b)=>a+b))]]);}})},
 {h:'The voltage divider',html:`<p>Two resistors in series across a supply. With nothing connected to the middle, the same current flows through both, so the supply splits in proportion to resistance:</p><p class="key"><b>Vout = Vin × R2 / (R1 + R2)</b>, where R2 is the bottom resistor.</p><p>Connecting a <b>load</b> puts RL in parallel with R2, which lowers the bottom resistance and pulls Vout down. Rule of thumb: keep RL at least 10× the divider’s Thevenin resistance (R1‖R2). Drag RL down and watch the output sag.</p>`,
  w:()=>({controls:[{id:'V',label:'Vin',min:1,max:24,step:0.5,val:12,fmt:fmtV},{id:'a',label:'R1 (top)',min:100,max:100000,val:10000,log:1,fmt:fmtR},{id:'b',label:'R2 (bottom)',min:100,max:100000,val:10000,log:1,fmt:fmtR},{id:'L',label:'Load RL',min:100,max:1e7,val:1e7,log:1,fmt:v=>v>=9.9e6?'none':ohm(v)}],
   render:v=>{const RL=v.L>=9.9e6?null:v.L,s=divSch(v.V,v.a,v.b,RL?{RL}:{}),Vu=v.V*v.b/(v.a+v.b),Rth=v.a*v.b/(v.a+v.b),Rp=RL?v.b*RL/(v.b+RL):v.b,Vo=v.V*Rp/(v.a+Rp);
    s.probe(260,155,'Vout',fmtV(Vo),-36,-34);return fitTag(s.svg())+ro([['Unloaded',fmtV(Vu)],['Actual',fmtV(Vo)],['Rth = R1‖R2',ohm(Rth)],['Sag',`${f2((1-Vo/Vu)*100,1)}%`]])+(RL?verdict(RL>=10*Rth,RL>=10*Rth?'Load is light enough (RL ≥ 10·Rth).':'Load is too heavy for this divider: buffer it or use smaller divider resistors.'):'');}})},
 {h:'Thevenin equivalents',html:`<p>Any network of sources and resistors, seen from two terminals, behaves exactly like one voltage source <b>Vth</b> in series with one resistor <b>Rth</b>.</p><ul><li><b>Vth</b> = the open-circuit voltage at the terminals (nothing connected).</li><li><b>Rth</b> = the resistance seen from the terminals with every voltage source replaced by a short (and current sources by an open).</li><li>Then any load sees <b>Vload = Vth × RL / (Rth + RL)</b>.</li></ul><p>For a divider: Vth = the unloaded output and Rth = R1‖R2. That is why the loading rule above compares RL to R1‖R2.</p>`},
 {h:'Power and ratings',html:`<p class="key"><b>P = V·I = I²R = V²/R.</b> Use whichever form uses the numbers you have.</p><p>Common through-hole resistors are rated ¼ W. Good practice is to keep dissipation under about half the rating, because a resistor at 90% of its rating runs very hot and drifts.</p>`,
  w:()=>({controls:[{id:'V',label:'Voltage across R',min:0.5,max:24,step:0.5,val:5,fmt:fmtV},{id:'R',label:'Resistance',min:10,max:10000,val:100,log:1,fmt:fmtR}],
   render:v=>{const P=v.V*v.V/v.R,r=P/0.25;const W=520,w=Math.min(1,r/1.5)*(W-80);
    return `<svg viewBox="0 0 ${W} 90"><rect x="40" y="30" width="${W-80}" height="26" style="fill:var(--grid2)"/><rect x="40" y="30" width="${w}" height="26" style="fill:${r<0.5?'var(--ok)':r<=1?'#E2B11E':'var(--probe)'}"/><line class="pla" x1="${40+(W-80)/1.5*0.5}" y1="24" x2="${40+(W-80)/1.5*0.5}" y2="62"/><line class="pla" x1="${40+(W-80)/1.5}" y1="24" x2="${40+(W-80)/1.5}" y2="62"/><text class="ptk" x="${40+(W-80)/1.5*0.5}" y="78" text-anchor="middle">50%</text><text class="ptk" x="${40+(W-80)/1.5}" y="78" text-anchor="middle">¼ W rating</text></svg>`+ro([['P',eng(P,'W')],['Of ¼ W',`${f2(r*100,0)}%`]])+verdict(r<0.5,r<0.5?'Comfortable.':r<=1?'Within rating but hot. Use a ½ W part.':'Over the rating: it will overheat.');}})},
 {h:'Fault signatures',html:`<table><tr><th>You measure</th><th>Likely meaning</th></tr><tr><td>Full supply at a node that should be lower</td><td>No current is flowing: an open downstream, or a short across the part above</td></tr><tr><td>0 V at a node that should be higher</td><td>Short to ground, or an open upstream</td></tr><tr><td>0 V across a resistor</td><td>No current through it: its path is open somewhere</td></tr><tr><td>Whole supply across one part</td><td>That part is open</td></tr><tr><td>Value off, but not at an extreme</td><td>Loading, wrong component value, or a device not fully on</td></tr></table><p class="key"><b>The method:</b> 1) predict what each node should read; 2) check power, ground and current limit; 3) measure along the signal path, splitting in half; 4) list the faults that would give exactly that reading; 5) confirm with one test, fix, and verify.</p>`}]},
{id:'diode',sub:'Forward drop, LED resistors, zeners, flyback',lead:'A diode is a one-way valve with a toll: current flows only from anode to cathode, and it costs a roughly fixed voltage to get through.',sections:[
 {h:'How a diode behaves',html:`<p>The triangle in the symbol points in the direction conventional current can flow (anode → cathode); the bar is the cathode. <b>Forward biased</b> (anode more positive by about the forward voltage), it conducts and holds roughly that voltage. <b>Reverse biased</b>, it blocks.</p><p>The real curve is exponential, which is why we can treat the diode as a near-constant drop once it is on. The widget plots the diode curve against the resistor’s <b>load line</b>: I = (Vs − V)/R. Where they cross is the operating point.</p>`,
  w:()=>({controls:[{id:'t',label:'Diode',type:'seg',options:[[0.7,'Silicon'],[2.0,'Red LED'],[2.2,'Green'],[3.0,'Blue']],val:2.0},{id:'V',label:'Supply',min:0.5,max:12,step:0.5,val:5,fmt:fmtV},{id:'R',label:'Resistor',min:47,max:10000,val:150,log:1,fmt:fmtR}],
   render:v=>{const nvt=v.t<1?0.045:0.07,Is=0.01/Math.exp(v.t/nvt),Id=x=>Is*(Math.exp(x/nvt)-1);let lo=0,hi=v.V;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(Id(m)-(v.V-m)/v.R>0)hi=m;else lo=m;}const Vd=(lo+hi)/2,I=(v.V-Vd)/v.R,ymax=Math.max(v.V/v.R*1e3*1.15,5),xmax=Math.max(v.V,v.t+0.6);
    const curve=[],load=[];for(let i=0;i<=120;i++){const x=xmax*i/120;curve.push([x,Id(x)*1e3]);load.push([x,(v.V-x)/v.R*1e3]);}
    return plot({x:[0,xmax],y:[0,ymax],series:[{pts:curve,cls:'pl1'},{pts:load,cls:'pl2',dash:1}],pts:[{x:Vd,y:I*1e3,label:'operating point'}],xlabel:'diode voltage (V)',ylabel:'current (mA)'})+
    ro([['Diode voltage',fmtV(Vd)],['Current',fmtI(I)],['Constant-drop estimate',v.V>v.t?fmtI((v.V-v.t)/v.R):'0 A']]);}})},
 {h:'Sizing an LED resistor',html:`<p class="key"><b>R = (Vsupply − Vf) / I.</b> The LED holds about Vf; the resistor takes the rest and sets the current. Round <i>up</i> to the next standard value.</p><p>Typical forward voltages: red ≈ 2.0 V, green ≈ 2.2 V, blue/white ≈ 3.0–3.1 V. Typical indicator current: 5–20 mA.</p>`,
  w:()=>({controls:[{id:'V',label:'Supply',min:3.3,max:24,step:0.1,val:5,fmt:fmtV},{id:'f',label:'LED',type:'seg',options:[[2.0,'Red'],[2.2,'Green'],[3.0,'Blue'],[3.1,'White']],val:2.0},{id:'I',label:'Target current',min:2,max:30,step:1,val:10,fmt:v=>v+' mA'}],
   render:v=>{if(v.V<=v.f)return verdict(false,'The supply is below the LED’s forward voltage, so it cannot light.');const R=(v.V-v.f)/(v.I/1e3),Rs=e12Up(R),Ia=(v.V-v.f)/Rs,P=Ia*Ia*Rs;const s=ledSch(v.V,ohm(Rs),{vf:v.f});
    return fitTag(s.svg())+ro([['Exact R',ohm(R)],['Standard value',ohm(Rs)],['Actual current',fmtI(Ia)],['Resistor power',eng(P,'W')]]);}})},
 {h:'Reverse polarity',html:`<p>A backwards diode blocks: no current, so 0 V across its resistor and the whole supply across the diode. LEDs are fragile in reverse: their reverse rating is typically only about 5 V, so a backwards LED on 12 V can be damaged.</p>`},
 {h:'Zener diodes',html:`<p>A zener is designed to conduct in <i>reverse</i> at a precise breakdown voltage Vz. With a series resistor it makes a simple reference or regulator. It only regulates while it carries current: Is = (Vs − Vz)/Rs, and the zener takes whatever the load does not (Iz = Is − IL). Too heavy a load starves it and the output drops below Vz.</p>`,
  w:()=>({controls:[{id:'V',label:'Supply',min:5,max:24,step:0.5,val:12,fmt:fmtV},{id:'z',label:'Zener',type:'seg',options:[[3.3,'3.3 V'],[5.1,'5.1 V'],[6.2,'6.2 V']],val:5.1},{id:'Rs',label:'Series RS',min:100,max:4700,val:470,log:1,fmt:fmtR},{id:'L',label:'Load RL',min:100,max:100000,val:2200,log:1,fmt:fmtR}],
   render:v=>{const open=v.V*v.L/(v.Rs+v.L),reg=open>v.z,Vo=reg?v.z:open,Is=(v.V-Vo)/v.Rs,IL=Vo/v.L,Iz=reg?Is-IL:0;const s=new Sch(520,290);s.two('src',[80,240],[80,70],'',`${v.V} V`,{left:true});s.wire([80,70],[130,70]);s.two('res',[130,70],[240,70],'RS',ohm(v.Rs));s.wire([240,70],[400,70]);s.two('zener',[290,240],[290,70],'Z1',`${v.z} V`);s.two('res',[400,70],[400,240],'RL',ohm(v.L));s.wire([400,240],[80,240]);s.gnd(180,240);s.dot(290,70);s.dot(290,240);s.probe(400,70,'Vout',fmtV(Vo),20,-24);
    return fitTag(s.svg())+ro([['Iz',fmtI(Iz)],['I load',fmtI(IL)],['Zener power',eng(Iz*v.z,'W')]])+verdict(reg,reg?'Regulating: the zener clamps the output.':'Out of regulation: the load pulls the output below Vz and the zener carries nothing.');}})},
 {h:'Flyback diodes',html:`<p>An inductor (relay coil, solenoid, motor) resists changes in current: V = L·di/dt. When a transistor switches it off, the current tries to stop instantly, so the coil generates a large voltage spike that can destroy the transistor. A diode across the coil (cathode to +V) is reverse biased during normal operation, then gives the current a loop to decay through at turn-off, clamping the collector at about +V + 0.7 V.</p>`,
  w:()=>({controls:[{id:'d',label:'Flyback diode',type:'seg',options:[[1,'Present'],[0,'Missing']],val:1}],
   render:v=>{const pts=[[-1,0.2],[0,0.2]];if(v.d){pts.push([0,12.7]);for(let i=0;i<=40;i++){const t=i/40*3;pts.push([t,12+0.7*Math.exp(-t*0.4)*(t<2.6?1:0)]);}pts.push([5,12]);}else{for(let i=0;i<=80;i++){const t=i/80*1.2;pts.push([t,12+68*Math.exp(-t*3)*Math.cos(t*14)]);}pts.push([5,12]);}
    return plot({x:[-1,5],y:[0,90],series:[{pts,cls:v.d?'pl3':'pl2'}],hl:[{y:60,label:'typical transistor VCE(max)',cls:'pl1'}],vl:[{x:0,label:'switch off',cls:'pl1'}],xlabel:'time (ms)',ylabel:'collector voltage (V)'})+verdict(!!v.d,v.d?'Clamped near 12.7 V. The transistor is safe.':'The spike goes far past the transistor’s rating.');}})}]},
{id:'xstr',sub:'BJT saturation, base resistors, MOSFET gate drive',lead:'As switches, transistors should be either fully off or fully on. Almost every transistor bug is a transistor stuck in between.',sections:[
 {h:'BJTs: three regions',html:`<p>An NPN has a base, collector and emitter. A small base current lets a larger collector current flow. The base–emitter junction is a diode, so VBE ≈ 0.7 V when on.</p><ul><li><b>Cutoff:</b> no base current, so no collector current. Switch off.</li><li><b>Active:</b> Ic = β·Ib. The transistor is an amplifier and drops voltage (and heat) across itself.</li><li><b>Saturation:</b> the load limits current before β·Ib does. VCE ≈ 0.2 V. Switch on.</li></ul><p class="key"><b>Ic = β·Ib</b> in the active region, and <b>Ie = Ic + Ib = (β + 1)·Ib</b> always: every bit of current that enters the base or collector leaves through the emitter (KCL). Because β is large, Ie ≈ Ic.</p><p class="key">Saturated when <b>β·Ib ≥ Ic(sat) = (Vcc − 0.2)/RC</b>. In saturation Ic is set by the load, not by β.</p>`,
  w:()=>({controls:[{id:'vin',label:'Vin',min:0,max:5,step:0.1,val:5,fmt:fmtV},{id:'rb',label:'RB',min:100,max:200000,val:10000,log:1,fmt:fmtR},{id:'rc',label:'RC (load)',min:47,max:10000,val:470,log:1,fmt:fmtR},{id:'b',label:'β',min:30,max:300,step:5,val:100,fmt:v=>v}],
   render:v=>{const Ib=Math.max(0,(v.vin-0.7)/v.rb),ics=(12-0.2)/v.rc,bi=v.b*Ib,reg=Ib<=0?'Cutoff':bi>=ics?'Saturated':'Active',Ic=reg==='Cutoff'?0:Math.min(bi,ics),Vce=reg==='Saturated'?0.2:12-Ic*v.rc;
    const{s,q}=bjtSch(`${v.vin} V`,ohm(v.rb),{lab:ohm(v.rc),beta:v.b});s.probe(q.c[0],q.c[1],'VCE',fmtV(Vce),44,-8);
    return fitTag(s.svg())+ro([['Ib',fmtI(Ib)],['β·Ib',fmtI(bi)],['Ic(sat)',fmtI(ics)],['Ic',fmtI(Ic)],['Ie = Ic + Ib',fmtI(Ic+Ib)],['Transistor heat',eng(Ic*Vce,'W')]])+verdict(reg!=='Active',`${reg}${reg==='Active'?': under-driven, so it drops voltage and runs warm. Reduce RB.':reg==='Saturated'?': fully on, a proper switch.':': fully off.'}`);}})},
 {h:'Designing the base resistor',html:`<ol><li>Load current Ic from the load (e.g. LED and resistor, relay coil).</li><li>Use the <b>minimum</b> β from the datasheet: Ib(min) = Ic/β.</li><li>Overdrive 5–10× for margin: Ib = k·Ic/β.</li><li>RB = (Vin − 0.7)/Ib. Round <i>down</i> to a standard value.</li></ol>`},
 {h:'MOSFETs',html:`<p>A MOSFET is voltage controlled. The gate is insulated (essentially a capacitor), so it draws no DC current. <b>VGS(th)</b> is where it <i>barely begins</i> to conduct (often defined at 250 µA), not where it is fully on. <b>RDS(on)</b> is only guaranteed at the VGS listed in the datasheet. A “logic-level” part specifies RDS(on) at 4.5 V or 2.5 V; a standard part only at 10 V.</p>`,
  w:()=>({controls:[{id:'t',label:'MOSFET',type:'seg',options:[['std','Standard (10 V)'],['ll','Logic-level']],val:'std'},{id:'vg',label:'Gate drive',min:0,max:12,step:0.1,val:3.3,fmt:fmtV},{id:'I',label:'Load current',min:0.1,max:5,step:0.1,val:2,fmt:v=>v+' A'}],
   render:v=>{const P=v.t==='std'?{vth:3,vf:10}:{vth:1,vf:2.5},R=g=>g<P.vth?1e3:g>=P.vf?0.05:Math.exp(Math.log(200)+(Math.log(0.05)-Math.log(200))*(g-P.vth)/(P.vf-P.vth)),pts=[];for(let i=0;i<=120;i++){const g=12*i/120;pts.push([g,Math.log10(R(g))]);}
    const r=R(v.vg),Pd=Math.min(v.I*v.I*r,v.I*12);
    return plot({x:[0,12],y:[-2,3],series:[{pts,cls:'pl1'}],vl:[{x:3.3,label:'3.3 V GPIO',cls:'pl3'}],pts:[{x:v.vg,y:Math.log10(r),label:r>=1e3?'off':ohm(r)}],xlabel:'VGS (V)',ylabel:'RDS (Ω, log scale)',yfmt:y=>ohm(10**y)})+
    ro([['RDS',r>=1e3?'off':ohm(r)],['Heat in FET',r>=1e3?'0 W':eng(Pd,'W')]])+verdict(r<=0.06,r<=0.06?'Fully enhanced: a good switch.':r>=1e3?'Off.':'Only partly on: high resistance, the FET overheats and the load is under-driven.');}})},
 {h:'Gate pull-down, gate resistor, and low-side placement',html:`<ul><li><b>Gate pull-down</b> (10–100 kΩ gate to source): during reset or power-up the GPIO is high-impedance, so without it the gate floats and the FET can turn on randomly.</li><li><b>Gate resistor</b> (10–100 Ω): limits the inrush current into the gate capacitance and damps ringing.</li><li><b>Low-side switch:</b> an N-channel FET between the load and ground has its source at 0 V, so VGS equals the GPIO voltage. On the high side the source rises with the load, so you would need a gate voltage above the supply (or a P-channel part).</li></ul>`}]},
{id:'opamp',sub:'Golden rules, gain configurations, comparators, TIAs',lead:'Op-amps look intimidating, but with negative feedback two rules solve nearly every circuit.',sections:[
 {h:'What an op-amp does',html:`<p>An op-amp amplifies the difference between its inputs by an enormous gain: Vout = A·(V+ − V−), with A around 100,000 or more. On its own it slams to a rail for almost any input difference. <b>Negative feedback</b> (output connected back to the − input) tames it into a precise amplifier. The output can never go beyond the supply rails.</p><p class="key"><b>Golden rules (with negative feedback):</b> 1) no current flows into the inputs; 2) the output does whatever it takes to make V− = V+.</p><p>To analyze: set V− equal to V+, then write KCL at the − node.</p>`},
 {h:'Configurations',html:`<table><tr><th>Circuit</th><th>Gain</th><th>Notes</th></tr><tr><td>Inverting</td><td>−RF/RIN</td><td>− input is a virtual ground; input impedance = RIN</td></tr><tr><td>Non-inverting</td><td>1 + RF/RG</td><td>Very high input impedance; gain ≥ 1</td></tr><tr><td>Follower</td><td>1</td><td>A buffer: high input impedance, low output impedance</td></tr><tr><td>Comparator</td><td>open loop</td><td>Output goes to whichever rail V+ vs V− dictates</td></tr></table>`,
  w:()=>({controls:[{id:'c',label:'Configuration',type:'seg',options:[['inv','Inverting'],['non','Non-inverting'],['fol','Follower'],['cmp','Comparator']],val:'non'},{id:'vin',label:'Vin',min:-5,max:5,step:0.05,val:1,fmt:fmtV},{id:'ri',label:'RIN / RG',min:1000,max:100000,val:10000,log:1,fmt:fmtR},{id:'rf',label:'RF',min:1000,max:470000,val:47000,log:1,fmt:fmtR},{id:'r',label:'Rails ±',min:3,max:15,step:0.5,val:12,fmt:v=>`±${v} V`}],
   render:v=>{const g={inv:-v.rf/v.ri,non:1+v.rf/v.ri,fol:1,cmp:null}[v.c],f=x=>v.c==='cmp'?(x>0?v.r:-v.r):Math.max(-v.r,Math.min(v.r,g*x)),pts=[];for(let i=0;i<=200;i++){const x=-5+10*i/200;pts.push([x,f(x)]);}
    let sv='';if(v.c==='inv')sv=invSch(v.ri,v.rf,{vin:v.vin}).s.svg();else if(v.c==='non')sv=noninvSch(v.ri,v.rf,v.vin).s.svg();else{const s=new Sch(520,270),p=s.opamp(330,170,true,{vp:v.r,vn:-v.r});s.term(140,154,'Vin','left',{v:v.vin});s.wire([140,154],p.top);if(v.c==='fol'){s.wire(p.bot,[270,186],[270,230],[420,230],[420,170]);s.dot(420,170);}else{s.wire(p.bot,[270,186],[270,215]);s.gnd(270,215);}s.wire(p.out,[455,170]);s.term(455,170,'Vout','right');sv=s.svg();}
    const vo=f(v.vin),sat=Math.abs(vo)>=v.r-1e-9;
    return fitTag(sv)+plot({h:220,x:[-5,5],y:[-15,15],series:[{pts,cls:'pl1'}],pts:[{x:v.vin,y:vo}],hl:[{y:v.r,cls:'pl2'},{y:-v.r,cls:'pl2'}],xlabel:'Vin (V)',ylabel:'Vout (V)'})+ro([['Gain',g==null?'open loop':f2(g,3)],['Vout',fmtV(vo)]])+(sat?verdict(false,'Output is at a rail.'):'');}})},
 {h:'Transimpedance amplifier (TIA)',html:`<p>A photodiode makes a tiny current proportional to light. Connect it to the − input of an op-amp with a feedback resistor RF: the − input is a virtual ground, so all the photocurrent flows through RF and <b>Vout = I × RF</b>. Bigger RF means more gain, but also less bandwidth and more noise. A small capacitor across RF keeps it stable. This is the front end of every fiber-optic receiver, and of your IR receiver board.</p>`,
  w:()=>({controls:[{id:'i',label:'Photocurrent',min:1e-7,max:1e-4,val:5e-6,log:1,fmt:fmtI},{id:'rf',label:'RF',min:1000,max:1e7,val:100000,log:1,fmt:fmtR}],
   render:v=>{const vo=Math.min(12,v.i*v.rf),{s}=invSch(0,v.rf,{tia:true,iph:v.i});return fitTag(s.svg())+ro([['Vout',fmtV(vo)]])+(v.i*v.rf>12?verdict(false,'Saturated at the rail: RF is too large for this light level.'):'');}})},
 {h:'Fault signatures',html:`<table><tr><th>Symptom</th><th>Likely cause</th></tr><tr><td>Output stuck at a rail, small input</td><td>Feedback broken (RF open) or the gain-setting resistor to ground shorted</td></tr><tr><td>Output = input in a non-inverting amp</td><td>RG open or RF shorted (it became a follower)</td></tr><tr><td>Output at a rail, large input</td><td>Normal clipping: gain × input exceeds the rail</td></tr><tr><td>Output near 0 always</td><td>No supply on the op-amp, or the input isn’t reaching it</td></tr></table><p>Always check the math first. Sometimes the rail is the correct answer.</p>`}]},
{id:'rc',sub:'Time constants, charging curves, filters, decoupling',lead:'Capacitors add time to circuits. One number, τ = RC, tells you almost everything.',sections:[
 {h:'Capacitors',html:`<p>A capacitor stores charge: Q = C·V. Current flows only while its voltage changes: I = C·dV/dt. Two consequences you will use constantly:</p><ul><li>Its voltage <b>cannot jump</b> instantly. At the moment of a step, an uncharged cap behaves like a short.</li><li>At DC steady state, no current flows. Treat it as an <b>open circuit</b>.</li></ul>`},
 {h:'Charging and discharging',html:`<p class="key"><b>τ = R·C.</b> Charging: Vc = Vs(1 − e^(−t/τ)). Discharging: Vc = V0·e^(−t/τ). After 1τ: 63%. 3τ: 95%. 5τ: about 99% (call it done).</p><p>Shortcut: kΩ × µF = ms.</p>`,
  w:()=>({controls:[{id:'m',label:'Mode',type:'seg',options:[['c','Charging'],['d','Discharging']],val:'c'},{id:'R',label:'R',min:100,max:1e6,val:10000,log:1,fmt:fmtR},{id:'C',label:'C',min:1e-9,max:1e-4,val:1e-6,log:1,fmt:fmtC}],
   render:v=>{const tau=v.R*v.C,f=t=>v.m==='c'?5*(1-Math.exp(-t/tau)):5*Math.exp(-t/tau),pts=[];for(let i=0;i<=150;i++){const t=6*tau*i/150;pts.push([t,f(t)]);}
    return plot({x:[0,6*tau],y:[0,5.5],xfmt:x=>eng(x,'s',2),series:[{pts,cls:'pl1'}],vl:[1,2,3,4,5].map(k=>({x:k*tau,label:k+'τ',cls:'pl3'})),xlabel:'time',ylabel:'Vc (V), 5 V step'})+ro([['τ',eng(tau,'s')],['63% at',eng(tau,'s')],['99% at',eng(5*tau,'s')]]);}})},
 {h:'RC low-pass filter',html:`<p>A series R with a C to ground passes low frequencies and attenuates high ones. Cutoff (−3 dB, output ≈ 70.7% of input): <b>fc = 1/(2πRC)</b>. Above fc the output falls 20 dB per decade (10× in frequency = 10× smaller). Every pull-up resistor plus wire capacitance is accidentally one of these.</p>`,
  w:()=>({controls:[{id:'R',label:'R',min:100,max:1e6,val:1600,log:1,fmt:fmtR},{id:'C',label:'C',min:1e-9,max:1e-5,val:1e-7,log:1,fmt:fmtC},{id:'f',label:'Signal frequency',min:1,max:1e6,val:1000,log:1,fmt:fmtF}],
   render:v=>{const fc=1/(2*Math.PI*v.R*v.C),H=f=>1/Math.sqrt(1+(f/fc)**2),pts=[];for(let i=0;i<=160;i++){const f=10**(i/160*6);pts.push([f,20*Math.log10(H(f))]);}
    return plot({x:[1,1e6],xlog:1,y:[-60,5],xfmt:x=>eng(x,'Hz',1).replace(' ',''),series:[{pts,cls:'pl1'}],vl:[{x:fc,label:'fc',cls:'pl3'}],pts:[{x:v.f,y:20*Math.log10(H(v.f))}],xlabel:'frequency',ylabel:'gain (dB)'})+ro([['fc',fmtF(fc)],['Gain at f',`${f2(20*Math.log10(H(v.f)),1)} dB`],['Vout/Vin',f2(H(v.f),3)]]);}})},
 {h:'Decoupling, and the shorted-cap signature',html:`<p>Digital chips draw current in fast spikes. The trace back to the regulator has inductance (V = L·di/dt), so the supply dips at the chip. A 100 nF ceramic right at each power pin supplies those spikes locally. Bulk caps (10 µF+) handle slower load changes.</p><p class="key"><b>Classic board fault:</b> rail reads near 0 V, the bench supply is in current limit, and one capacitor is warm. A decoupling cap has failed short.</p>`}]},
{id:'ac',sub:'RMS, frequency, decibels, dBm, reactance',lead:'Signals that change over time, and the logarithmic units used to describe them. Optical transceiver specs live in this world.',sections:[
 {h:'Frequency, peak and RMS',html:`<p>A periodic signal repeats every period T, and its frequency is f = 1/T. Amplitude has three common measures: <b>peak</b> (center to top), <b>peak-to-peak</b> (bottom to top, twice the peak for symmetric waves), and <b>RMS</b>, the DC voltage that would heat a resistor by the same amount. Scopes show peak and peak-to-peak; DMMs show RMS.</p><table><tr><th>Wave</th><th>RMS</th></tr><tr><td>Sine</td><td>Vpk/√2 ≈ 0.707·Vpk</td></tr><tr><td>Square (±V)</td><td>Vpk</td></tr><tr><td>Triangle</td><td>Vpk/√3 ≈ 0.577·Vpk</td></tr><tr><td>0-to-V PWM, duty D</td><td>average D·V; RMS V·√D</td></tr></table>`,
  w:()=>({controls:[{id:'t',label:'Waveform',type:'seg',options:[['sin','Sine'],['sq','Square'],['tri','Triangle']],val:'sin'},{id:'a',label:'Peak',min:0.5,max:10,step:0.1,val:5,fmt:fmtV},{id:'f',label:'Frequency',min:10,max:100000,val:1000,log:1,fmt:fmtF}],
   render:v=>{const T=1/v.f,k={sin:Math.SQRT1_2,sq:1,tri:1/Math.sqrt(3)}[v.t],fn=ph=>{const p=ph%1;return v.t==='sin'?Math.sin(2*Math.PI*ph):v.t==='sq'?(p<0.5?1:-1):(p<0.25?4*p:p<0.75?2-4*p:4*p-4);},pts=[];for(let i=0;i<=400;i++){const ph=2*i/400;pts.push([ph*T,v.a*fn(ph)]);}
    return plot({x:[0,2*T],y:[-11,11],xfmt:x=>eng(x,'s',2),series:[{pts,cls:'pl1'}],hl:[{y:v.a,label:'+peak'},{y:v.a*k,label:'RMS',cls:'pl3'},{y:-v.a,label:'−peak'}],xlabel:'time',ylabel:'volts'})+ro([['Peak',fmtV(v.a)],['Peak-to-peak',fmtV(2*v.a)],['RMS',fmtV(v.a*k)],['Period',eng(T,'s')]]);}})},
 {h:'Average power',html:`<p class="key"><b>P = Vrms²/R.</b> RMS exists precisely so that the DC power formulas keep working for AC.</p>`},
 {h:'Decibels',html:`<p>A decibel is a logarithmic ratio. <b>Power: dB = 10·log₁₀(P2/P1). Voltage or current: dB = 20·log₁₀(V2/V1)</b> (power goes as voltage squared, hence the 20). In a chain of stages, gains and losses in dB simply add.</p><table><tr><th>dB</th><th>Power ×</th><th>Voltage ×</th></tr><tr><td>+3</td><td>2</td><td>1.41</td></tr><tr><td>+6</td><td>4</td><td>2</td></tr><tr><td>+10</td><td>10</td><td>3.16</td></tr><tr><td>+20</td><td>100</td><td>10</td></tr><tr><td>−3</td><td>0.5</td><td>0.707</td></tr><tr><td>−20</td><td>0.01</td><td>0.1</td></tr></table>`,
  w:()=>({controls:[{id:'r',label:'Ratio (out ÷ in)',min:0.001,max:1000,val:2,log:1,fmt:v=>sig(v,3)+'×'}],render:v=>ro([['As a power ratio',`${f2(10*Math.log10(v.r),2)} dB`],['As a voltage ratio',`${f2(20*Math.log10(v.r),2)} dB`]])})},
 {h:'dBm and optical link budgets',html:`<p><b>dBm</b> is absolute power relative to 1 mW: dBm = 10·log₁₀(P / 1 mW). 0 dBm = 1 mW, −10 dBm = 100 µW, −30 dBm = 1 µW. Optical transceivers report transmit and receive power in dBm through DOM.</p><p>A <b>link budget</b> subtracts every loss from the transmit power: fiber attenuation (about 0.35 dB/km for single-mode at 1310 nm, about 3 dB/km for multimode at 850 nm), connectors (about 0.5 dB each) and splices. The <b>margin</b> is expected receive power minus the receiver’s sensitivity; 3 dB or more is comfortable.</p>`,
  w:()=>({controls:[{id:'tx',label:'Tx power',min:-8,max:4,step:0.5,val:-1,fmt:v=>v+' dBm'},{id:'m',label:'Fiber',type:'seg',options:[['sm','Single-mode'],['mm','Multimode']],val:'sm'},{id:'km',label:'Length',min:0.05,max:40,val:10,log:1,fmt:v=>sig(v,3)+' km'},{id:'n',label:'Connectors',min:0,max:8,step:1,val:2,fmt:v=>v},{id:'s',label:'Rx sensitivity',min:-24,max:-6,step:0.5,val:-14,fmt:v=>v+' dBm'}],
   render:v=>{const a=v.m==='sm'?0.35:3,fl=a*v.km,cl=0.5*v.n,rx=v.tx-fl-cl,mg=rx-v.s,W=520,sc=x=>40+(Math.max(-40,Math.min(10,x))+40)/50*(W-160);
    const bar=(y,from,to,col,lab)=>`<rect x="${Math.min(sc(from),sc(to))}" y="${y}" width="${Math.max(1,Math.abs(sc(to)-sc(from)))}" height="22" style="fill:${col}"/><text class="ptk" x="${Math.max(sc(from),sc(to))+6}" y="${y+15}">${lab}</text>`;
    return `<svg viewBox="0 0 ${W} 156" role="img" aria-label="Link budget">${bar(10,-40,v.tx,'var(--ink)','Tx '+f2(v.tx)+' dBm')}${bar(42,v.tx-fl,v.tx,'var(--probe)','fiber −'+f2(fl)+' dB')}${bar(74,rx,v.tx-fl,'#E2B11E','connectors −'+f2(cl)+' dB')}${bar(106,-40,rx,mg>=3?'var(--ok)':'var(--probe)','Rx '+f2(rx)+' dBm')}<line class="pl2 pld" x1="${sc(v.s)}" y1="4" x2="${sc(v.s)}" y2="134" style="stroke-width:1.4"/><text class="ptk" x="${sc(v.s)+4}" y="150">sensitivity ${v.s} dBm</text></svg>`+ro([['Expected Rx',f2(rx)+' dBm'],['Margin',f2(mg)+' dB']])+verdict(mg>=3,mg>=3?'Healthy margin.':mg>=0?'Thin margin: a dirty connector could drop the link.':'The link fails: received power is below sensitivity.');}})},
 {h:'Reactance',html:`<p>Capacitors and inductors oppose AC by an amount that depends on frequency. <b>Xc = 1/(2πfC)</b> falls as frequency rises: a capacitor is open at DC and nearly a short at high frequency. <b>XL = 2πfL</b> rises with frequency: an inductor is a short at DC and resists fast changes.</p>`,
  w:()=>({controls:[{id:'C',label:'C',min:1e-9,max:1e-4,val:1e-7,log:1,fmt:fmtC},{id:'L',label:'L',min:1e-6,max:0.1,val:1e-3,log:1,fmt:v=>eng(v,'H')},{id:'f',label:'Frequency',min:1,max:1e7,val:1000,log:1,fmt:fmtF}],
   render:v=>{const xc=f=>1/(2*Math.PI*f*v.C),xl=f=>2*Math.PI*f*v.L,a=[],b=[];for(let i=0;i<=140;i++){const f=10**(i/140*7);a.push([f,Math.log10(xc(f))]);b.push([f,Math.log10(xl(f))]);}
    return plot({x:[1,1e7],xlog:1,y:[-2,8],xfmt:x=>eng(x,'Hz',1).replace(' ',''),yfmt:y=>ohm(10**y),series:[{pts:a,cls:'pl1'},{pts:b,cls:'pl2'}],vl:[{x:v.f,cls:'pl3'}],xlabel:'frequency (black = capacitor, red = inductor)',ylabel:'reactance, log scale'})+ro([['Xc',ohm(xc(v.f))],['XL',ohm(xl(v.f))]]);}})}]},
{id:'digital',sub:'Logic levels, pull-ups, open-drain, edge rates',lead:'Where analog meets digital. This is where your Ouster pulse-loss story lives.',sections:[
 {h:'Logic levels',html:`<p>A driver guarantees its output is at least <b>V_OH</b> when high and at most <b>V_OL</b> when low. A receiver guarantees it reads high above <b>V_IH</b> and low below <b>V_IL</b>. It works if V_OH > V_IH and V_OL < V_IL, and the driver never exceeds the receiver’s absolute maximum.</p><table><tr><th>Family</th><th>V_IH</th><th>V_IL</th></tr><tr><td>CMOS (scales with VDD)</td><td>≈ 0.7·VDD</td><td>≈ 0.3·VDD</td></tr><tr><td>5 V CMOS</td><td>3.5 V</td><td>1.5 V</td></tr><tr><td>TTL-compatible</td><td>2.0 V</td><td>0.8 V</td></tr></table>`,
  w:()=>({controls:[{id:'d',label:'Driver output',type:'seg',options:[[3.3,'3.3 V'],[5,'5 V']],val:3.3},{id:'r',label:'Receiver input',type:'seg',options:[['c3','3.3 V CMOS'],['t3','3.3 V, 5 V-tolerant'],['c5','5 V CMOS'],['t5','5 V TTL-level']],val:'c5'}],
   render:v=>{const R={c3:{vih:2.31,max:3.6},t3:{vih:2.31,max:5.5},c5:{vih:3.5,max:5.5},t5:{vih:2.0,max:5.5}}[v.r];
    const ok=v.d>=R.vih&&v.d<=R.max;return ro([['Driver high',fmtV(v.d)],['Receiver V_IH',fmtV(R.vih)],['Receiver max',fmtV(R.max)]])+verdict(ok,v.d>R.max?'Over the receiver’s maximum rating: risk of damage. Use a level shifter or divider.':v.d<R.vih?'Not guaranteed: the high level is below V_IH, so it may read as low.':'Works reliably.');}})},
 {h:'Pull-ups, pull-downs and floating inputs',html:`<p>A CMOS input draws essentially no current, so an undriven line has no defined voltage. It floats and picks up noise. A <b>pull-up</b> (to VCC) or <b>pull-down</b> (to ground) gives it a default state; a button or driver overrides it.</p><p>An <b>open-drain</b> (or open-collector) output can only pull low. When released, only the pull-up brings the line high. This lets several devices share one line (I²C, interrupt lines) and lets a 3.3 V device signal to a 5 V device, but it makes rising edges slow.</p>`},
 {h:'Rise time and missed pulses',html:`<p>When an open-drain driver releases the line, the pull-up R charges the line capacitance C: an RC charge. The 10–90% rise time is about <b>2.2·R·C</b>. Falls are fast (a transistor actively pulls down); rises are slow. If the rise time is a big fraction of the pulse’s high time, the input crosses its threshold late or never: pulses get lost. Push the frequency up or use a weak internal pull-up and watch it fail.</p>`,w:W_RISE},
 {h:'Choosing a pull-up',html:`<p class="key">It is a window: <b>R ≥ VCC / I_sink(max)</b> (so the driver can pull low) and <b>R ≤ tr(max) / (2.2·C)</b> (so edges are fast enough).</p><p>Typical: 4.7–10 kΩ for slow signals, 1–2.2 kΩ for fast I²C or long cables. MCU internal pull-ups are weak (≈ 20–50 kΩ), which is fine for buttons but too slow for fast signals.</p>`}]},
{id:'power',sub:'Linear regulators, dropout, buck converters, bench supplies',lead:'Where the power comes from, where it goes, and why the bench supply can fool you.',sections:[
 {h:'Linear regulators',html:`<p>A linear regulator is a transistor acting as a self-adjusting resistor that drops whatever voltage is needed to hold the output steady. The full load current flows through it, so it burns <b>P = (Vin − Vout)·I</b>, and efficiency is about Vout/Vin. Quiet and simple, but wasteful for big drops at high current.</p><p><b>Dropout</b> is the minimum Vin − Vout it needs. Below Vout + dropout, the output follows the input down.</p>`,
  w:()=>({controls:[{id:'vi',label:'Vin',min:4,max:24,step:0.5,val:12,fmt:fmtV},{id:'vo',label:'Vout',type:'seg',options:[[3.3,'3.3 V'],[5,'5 V']],val:3.3},{id:'I',label:'Load current',min:0.05,max:2,step:0.05,val:0.5,fmt:v=>v+' A'}],
   render:v=>{if(v.vi<v.vo+0.3)return verdict(false,'Vin is below Vout plus dropout, so the regulator cannot regulate.');const P=(v.vi-v.vo)*v.I,Tj=25+P*60,buck=v.vo*v.I/0.9-v.vo*v.I;
    return ro([['Linear heat',eng(P,'W')],['Efficiency',`${f2(v.vo/v.vi*100,0)}%`],['Junction temp (no heatsink, ≈60 °C/W)',`${f2(Tj,0)} °C`],['Buck at 90% would waste',eng(buck,'W')]])+verdict(Tj<100,Tj<100?'Fine without a heatsink.':Tj<150?'Needs a heatsink.':'Far too hot. Use a buck converter.');}})},
 {h:'Buck converters',html:`<p>A buck converter switches the input on and off quickly, and an inductor plus capacitor average the result. Ideally <b>Vout = D·Vin</b>, where D is the fraction of time the switch is on. Power is conserved (minus 5–15% loss), so the input current is <i>less</i> than the output current: Iin = Vout·Iout/(η·Vin). The trade-off is switching noise and more parts.</p>`,
  w:()=>({controls:[{id:'vi',label:'Vin',min:5,max:24,step:0.5,val:12,fmt:fmtV},{id:'D',label:'Duty cycle',min:0.05,max:0.95,step:0.01,val:0.42,fmt:v=>`${f2(v*100,0)}%`}],
   render:v=>{const pts=[];for(let k=0;k<4;k++){pts.push([k,0],[k,v.vi],[k+v.D,v.vi],[k+v.D,0]);}pts.push([4,0]);
    return plot({x:[0,4],y:[0,26],series:[{pts,cls:'pl1'}],hl:[{y:v.D*v.vi,label:`average = ${f2(v.D*v.vi)} V`,cls:'pl3'}],xlabel:'switching periods',ylabel:'switch node (V)'})+ro([['Vout ≈ D·Vin',fmtV(v.D*v.vi)]]);}})},
 {h:'Bench supplies: CV vs CC',html:`<p>A bench supply has a voltage setpoint and a current limit. Below the limit it holds the voltage (<b>CV</b>, constant voltage). If the load tries to draw more, it switches to <b>CC</b> (constant current) and lowers the voltage to hold the current at the limit. A circuit that “works at light load but collapses when the motor starts” is often just the supply in CC mode.</p>`,
  w:()=>({controls:[{id:'V',label:'Voltage setpoint',min:1,max:30,step:0.5,val:12,fmt:fmtV},{id:'I',label:'Current limit',min:0.05,max:3,step:0.05,val:0.5,fmt:v=>v+' A'},{id:'R',label:'Load',min:1,max:1000,val:10,log:1,fmt:fmtR}],
   render:v=>{const Iw=v.V/v.R,cc=Iw>v.I,Vo=cc?v.I*v.R:v.V,Io=cc?v.I:Iw;return ro([['Mode',cc?'CC':'CV'],['Output voltage',fmtV(Vo)],['Output current',fmtI(Io)]])+verdict(!cc,cc?'Current limited: the supply has lowered the voltage.':'Constant voltage: the load gets the setpoint.');}})}]},
{id:'meas',sub:'DMM technique, meter loading, oscilloscopes',lead:'Interviewers listen for how you would measure, not just what. These habits show you have been at a bench.',sections:[
 {h:'Using a DMM',html:`<ul><li><b>Voltage:</b> leads in parallel (across) the part. Circuit powered.</li><li><b>Current:</b> the meter must be in series, so you break the circuit and insert it. Moving leads to the A jack makes the meter nearly a short; probing across a supply that way blows the fuse.</li><li><b>Resistance and continuity:</b> power off. In-circuit readings include every parallel path, so lift one leg for a true value.</li><li><b>Diode test:</b> shows a junction’s forward voltage. A good diode reads ~0.5–0.7 V one way and OL the other.</li></ul><p>Try every combination on a 9 V supply with R1 = 1 kΩ and R2 = 2 kΩ in series:</p>`,
  w:()=>({controls:[{id:'m',label:'Meter mode',type:'seg',options:[['V','Volts'],['A','Amps'],['O','Ohms']],val:'V'},{id:'p',label:'Placement',type:'seg',options:[['x','Across R2'],['s','In series with R2']],val:'x'},{id:'w',label:'Power',type:'seg',options:[['on','On'],['off','Off']],val:'on'}],
   render:v=>{const K=v.m+v.p+v.w,M={Vxon:[1,'Reads 6.00 V. Correct way to measure voltage.'],Vxoff:[0,'Reads 0 V. Nothing to measure with the power off.'],Vson:[0,'Reads about 9 V: the meter’s high impedance replaced the path, so no current flows and you see the full supply.'],Vsoff:[0,'Reads 0 V and tells you nothing.'],
     Axon:[0,'Shorts out R2: the meter reads 9 mA (only R1 limits it) and you changed the circuit. Across a supply this would blow the fuse.'],Axoff:[0,'Reads 0 A: no power, no current.'],Ason:[1,'Reads 3.00 mA. Correct: current measured in series.'],Asoff:[0,'Reads 0 A: no power.'],
     Oxon:[0,'Garbage reading, and you risk damaging the meter. Never measure ohms on a powered circuit.'],Oxoff:[0,'Reads about 667 Ω, not 2 kΩ: R1 plus the supply form a parallel path. Lift one leg of R2 to measure it alone.'],Oson:[0,'Meaningless: ohms on a powered circuit.'],Osoff:[0,'Reads open (OL), since the circuit is broken. Not a resistance measurement.']}[K];
    return verdict(!!M[0],M[1]);}})},
 {h:'Meter loading',html:`<p>A DMM’s voltage input is about 10 MΩ. On low-impedance circuits that is invisible, but on a high-impedance divider the meter becomes part of the circuit and reads low.</p>`,
  w:()=>({controls:[{id:'R',label:'Each divider resistor',min:1000,max:1e8,val:1e7,log:1,fmt:fmtR},{id:'m',label:'Meter input',type:'seg',options:[[1e6,'1 MΩ'],[1e7,'10 MΩ'],[1e9,'1 GΩ']],val:1e7}],
   render:v=>{const rp=v.R*v.m/(v.R+v.m),rd=10*rp/(v.R+rp),err=(5-rd)/5*100;return ro([['True midpoint','5.00 V'],['Meter reads',fmtV(rd)],['Error',`${f2(err,1)}%`]])+verdict(err<1,err<1?'Negligible loading.':'The meter is loading the circuit.');}})},
 {h:'Oscilloscope essentials',html:`<ul><li><b>Ground clip:</b> it connects to earth through the scope’s power cord. Clip it only to circuit ground, or you short that node.</li><li><b>10× probes:</b> lighter loading and more bandwidth than 1×. Set the channel to match, or readings are off by 10.</li><li><b>Coupling:</b> DC shows everything; AC removes the DC level so you can zoom in on small ripple.</li><li><b>Trigger:</b> a waveform that scrolls needs the trigger source and level set inside the signal.</li><li><b>Bandwidth and ground lead:</b> rounded edges or ringing can be the measurement, not the circuit. Use a short ground spring for fast edges.</li></ul><p>Try to see 50 mV of ripple on a 12 V rail:</p>`,
  w:()=>({controls:[{id:'c',label:'Coupling',type:'seg',options:[['dc','DC'],['ac','AC']],val:'dc'},{id:'d',label:'Vertical scale',type:'seg',options:[[5,'5 V/div'],[0.5,'0.5 V/div'],[0.02,'20 mV/div']],val:5},{id:'p',label:'Probe setting',type:'seg',options:[['ok','Matched'],['mis','10× probe, 1× channel']],val:'ok'}],
   render:v=>{const W=520,H=320,dx=W/10,dy=H/8,k=v.p==='mis'?0.1:1,off=v.c==='dc'?12*k:0;let g=`<rect x="0" y="0" width="${W}" height="${H}" style="fill:#0E1A12"/>`;for(let i=1;i<10;i++)g+=`<line x1="${i*dx}" y1="0" x2="${i*dx}" y2="${H}" style="stroke:#284234;stroke-width:1"/>`;for(let i=1;i<8;i++)g+=`<line x1="0" y1="${i*dy}" x2="${W}" y2="${i*dy}" style="stroke:#284234;stroke-width:1"/>`;
    const pts=[];let offscreen=false;for(let i=0;i<=400;i++){const t=i/400*4,saw=(t%1)*-0.05+0.025,val=off+saw*k,y=H/2-val/v.d*dy;if(y<0||y>H)offscreen=true;pts.push(`${i/400*W},${Math.max(-5,Math.min(H+5,y)).toFixed(1)}`);}
    g+=`<polyline points="${pts.join(' ')}" style="fill:none;stroke:#7CF29A;stroke-width:2"/>`;
    const ok=v.c==='ac'&&v.d===0.02&&v.p==='ok';return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scope screen">${g}</svg>`+verdict(ok,offscreen?'The trace is off screen: the 12 V DC level pushes it out of view at this scale.':ok?'Ripple clearly visible: AC coupling removed the 12 V.':v.p==='mis'?'Everything reads 10× too small: the probe and channel settings don’t match.':'The ripple is too small to see at this scale.');}})},
 {h:'The troubleshooting method (say it out loud)',html:`<ol><li><b>Understand intent:</b> what should this do? Predict key node voltages first.</li><li><b>Check the basics:</b> power present, ground connected, supply not in current limit, anything hot.</li><li><b>Measure and compare:</b> work along the signal path; half-split to rule out half at a time.</li><li><b>Hypothesize from the signature:</b> list the specific failures that produce exactly what you measured.</li><li><b>Confirm with one test,</b> fix, then verify the whole circuit again.</li></ol>`}]},
{id:'portfolio',sub:'Low-supply indicator, IR receiver, the Ouster fix',lead:'Expect “walk me through this circuit.” For each stage, know what it does, why those values, and what happens if a part fails.',sections:[
 {h:'Low-supply indicator: live walkthrough',html:`<p><b>Divider (R1/R2):</b> scales the supply down to compare it. <b>Zener (Z1 with R3):</b> a fixed reference that doesn’t move when the supply moves. <b>Comparator:</b> output goes high when the scaled supply (− input) falls below the reference (+ input). <b>R4 and LED:</b> the indicator. The trip point is <b>Vs = Vz·(R1 + R2)/R2</b>. Slide the supply down past it and watch every node update (computed by the built-in simulator):</p>`,
  w:()=>({controls:[{id:'vs',label:'Supply Vs',min:5,max:12,step:0.1,val:9.5,fmt:fmtV},{id:'r1',label:'R1 (pot setting)',min:2000,max:30000,step:100,val:17000,fmt:fmtR}],
   render:v=>{const{s,p}=lsiSch(v.r1,10000,3.3,{vs:v.vs});const{r}=tagSim(s,[[[90,230],'−',12,-12],[[260,154],'+',8,-12],[p.out,'out',6,-26]]);if(r.error)return r.error;
    const on=r.netV(p.out)>2.5,trip=3.3*(v.r1+10000)/10000;return fitTag(s.svg())+ro([['Trip point',fmtV(trip)],['LED',on?'ON (low supply)':'off']])+verdict(!on,on?'Supply is below the trip point: indicator on.':'Supply is healthy.');}})},
 {h:'What if a part fails?',html:`<table><tr><th>Failure</th><th>What you would measure</th><th>Symptom</th></tr><tr><td>Z1 open</td><td>+ input rises toward 5 V</td><td>LED on even with a fresh supply</td></tr><tr><td>R2 open</td><td>− input sits at the full supply</td><td>LED never turns on</td></tr><tr><td>R1 open</td><td>− input pulled to 0 V</td><td>LED always on</td></tr><tr><td>LED backwards</td><td>Comparator output correctly high</td><td>LED never lights</td></tr></table><p>Practice these in the Simulator tab: load the low-supply indicator, then open or short parts yourself.</p>`},
 {h:'Receiver: photodiode, TIA, amplifier',html:`<p>The photodiode turns IR light into a few microamps. The transimpedance amp converts that to a voltage (Vout = I·RF). A non-inverting stage boosts it enough to drive the indicator LED. If asked what you would improve: mention the TIA gain–bandwidth trade-off, a small capacitor across RF for stability, and modulating the IR so ambient light can be filtered out.</p>`},
 {h:'The Ouster pulse-loss story',html:`<p><b>Situation:</b> frequency readings from the lidar’s multipurpose I/O were dropping about 20% of pulses. <b>Cause:</b> an open-drain style output relying on a weak pull-up, combined with line capacitance, gave a slow RC rising edge; at higher frequencies the line did not cross the input threshold reliably. <b>Fix:</b> a stronger pull-up circuit for faster edges, plus high-rate sampling with custom edge detection in Python. <b>Result:</b> pulse loss eliminated, and the test runs automatically in CI.</p><p>Reproduce it here: start with a ~40 kΩ internal pull-up, then lower R until the edges are clean.</p>`,w:W_RISE},
 {h:'A template for “walk me through it”',html:`<ol><li>One sentence: what the circuit is for.</li><li>Trace the signal from input to output, stage by stage.</li><li>For each stage: what it does, the key formula, why you picked the values.</li><li>One failure mode per stage and how you would detect it.</li><li>What you would change in a second revision.</li></ol>`}]}];

 ['Units and anchors',`<ul><li>p 10⁻¹², n 10⁻⁹, µ 10⁻⁶, m 10⁻³, k 10³, M 10⁶</li><li>V/kΩ = mA; kΩ × µF = ms; kΩ × nF = µs</li><li>1 V across 1 kΩ = 1 mA = 1 mW</li></ul>`],
 ['DC formulas',`<ul><li>V = IR; P = VI = I²R = V²/R</li><li>Series: R1 + R2. Parallel: R1R2/(R1 + R2), less than the smallest</li><li>KCL: in = out at a node. KVL: drops = supply around a loop</li><li>Derate resistors to ≤ 50% of rating (¼ W common)</li></ul>`],
 ['Divider, loading, Thevenin',`<ul><li>Vout = Vin·R2/(R1 + R2)</li><li>Loaded: use R2‖RL in place of R2</li><li>Vth = open-circuit V; Rth = R with sources shorted</li><li>Divider Rth = R1‖R2; keep RL ≥ 10·Rth</li><li>Vload = Vth·RL/(Rth + RL)</li></ul>`],
 ['Diodes and LEDs',`<table><tr><td>Silicon</td><td>≈ 0.7 V</td></tr><tr><td>Schottky</td><td>≈ 0.3 V</td></tr><tr><td>Red / yellow</td><td>≈ 2.0 V</td></tr><tr><td>Green</td><td>≈ 2.2 V</td></tr><tr><td>Blue / white</td><td>≈ 3.0–3.1 V</td></tr></table><ul><li>R = (Vs − Vf)/I, round up</li><li>LED reverse rating ≈ 5 V</li><li>Flyback diode across coil, cathode to +V</li></ul>`],
 ['Zener regulator',`<ul><li>Regulates only if Vs·RL/(RS + RL) > Vz</li><li>IS = (Vs − Vz)/RS; IL = Vz/RL; Iz = IS − IL</li><li>Zener power = Vz·Iz</li></ul>`],
 ['BJT switch',`<ul><li><b>Active region: Ic = β·Ib</b></li><li><b>Ie = Ic + Ib = (β + 1)·Ib</b></li><li>α = Ic/Ie = β/(β + 1) ≈ 1, so Ic ≈ Ie</li><li>VBE ≈ 0.7 V; VCE(sat) ≈ 0.2 V</li><li>Ic(sat) = (Vcc − 0.2)/RC</li><li>Saturated if β·Ib ≥ Ic(sat)</li><li>RB = (Vin − 0.7)/(k·Ic/β_min), k = 5–10; round down</li></ul>`],
 ['MOSFET switch',`<ul><li>VGS(th) = barely on; check RDS(on) at your actual VGS</li><li>3.3 V drive needs a logic-level part</li><li>Gate pull-down 10–100 kΩ; gate resistor 10–100 Ω</li><li>N-channel on the low side: VGS = gate voltage</li><li>Heat = I²·RDS(on)</li></ul>`],
 ['Op-amps',`<table><tr><td>Inverting</td><td>−RF/RIN</td></tr><tr><td>Non-inverting</td><td>1 + RF/RG</td></tr><tr><td>Follower</td><td>1 (buffer)</td></tr><tr><td>Comparator</td><td>rail by sign of V+ − V−</td></tr><tr><td>TIA</td><td>Vout = I·RF</td></tr></table><ul><li>Feedback ⇒ V− = V+, no input current</li><li>Output never exceeds the rails</li></ul>`],
 ['RC and filters',`<table><tr><td>1τ</td><td>63%</td></tr><tr><td>2.2τ</td><td>90% (10–90% rise time)</td></tr><tr><td>3τ</td><td>95%</td></tr><tr><td>5τ</td><td>99%</td></tr></table><ul><li>τ = RC; Vc = Vs(1 − e^(−t/τ)); t = −τ·ln(1 − x)</li><li>fc = 1/(2πRC); −20 dB/decade above</li><li>DC steady state: cap = open; at a step: uncharged cap = short</li><li>100 nF decoupling at every IC power pin</li></ul>`],
 ['Signals, AC and dB',`<ul><li>Sine: Vrms = Vpk/√2 ≈ 0.707·Vpk; Vpp = 2·Vpk</li><li>PWM 0–V: average D·V, RMS V·√D</li><li>f = 1/T; P = Vrms²/R</li><li>Xc = 1/(2πfC); XL = 2πfL</li></ul><table><tr><th>dB</th><th>Power ×</th><th>Voltage ×</th></tr><tr><td>3</td><td>2</td><td>1.41</td></tr><tr><td>6</td><td>4</td><td>2</td></tr><tr><td>10</td><td>10</td><td>3.16</td></tr><tr><td>20</td><td>100</td><td>10</td></tr></table><ul><li>Power dB = 10·log₁₀; voltage dB = 20·log₁₀</li><li>dBm = 10·log₁₀(P/1 mW); 0 dBm = 1 mW</li><li>Rx = Tx − losses; margin = Rx − sensitivity</li><li>SM ≈ 0.35 dB/km @1310; MM ≈ 3 dB/km @850; connector ≈ 0.5 dB</li></ul>`],
 ['Linux for diagnostics',`<table><tr><td><code>dmesg | grep -i err</code></td><td>kernel errors</td></tr><tr><td><code>journalctl -k -f</code></td><td>follow kernel log</td></tr><tr><td><code>lspci -vv</code>, <code>lsusb</code></td><td>enumerated devices</td></tr><tr><td><code>i2cdetect -y 1</code></td><td>scan I²C bus 1</td></tr><tr><td><code>i2cget -y 1 0x48 0x00</code></td><td>read a register</td></tr><tr><td><code>ethtool eth0</code> / <code>-S</code></td><td>link settings / counters</td></tr><tr><td><code>ip -s link</code></td><td>interfaces and stats</td></tr><tr><td><code>cat /sys/class/net/eth0/carrier</code></td><td>link up (1) or down (0)</td></tr><tr><td><code>grep -c PASS log</code></td><td>count matches</td></tr><tr><td><code>awk '{print $3}'</code></td><td>third column</td></tr><tr><td><code>sort | uniq -c | sort -rn</code></td><td>count and rank</td></tr><tr><td><code>tail -f log</code></td><td>watch a file</td></tr><tr><td><code>watch -n1 cmd</code></td><td>rerun every second</td></tr><tr><td colspan="2" class="note">Practice all of these in the Linux tab.</td></tr><tr><td><code>ps aux | grep py</code></td><td>find a process</td></tr><tr><td><code>chmod +x run.sh</code></td><td>make executable</td></tr></table><pre>import subprocess

 ['Logic levels',`<table><tr><th></th><th>V_IH</th><th>V_IL</th></tr><tr><td>3.3 V CMOS</td><td>2.31</td><td>0.99</td></tr><tr><td>5 V CMOS</td><td>3.5</td><td>1.5</td></tr><tr><td>TTL-level</td><td>2.0</td><td>0.8</td></tr></table><ul><li>3.3 V → 5 V CMOS: not guaranteed</li><li>5 V → 3.3 V: only if 5 V-tolerant</li><li>Floating input = undefined; add a pull</li></ul>`],
 ['Pull-ups and edges',`<ul><li>Open-drain only pulls low; needs a pull-up</li><li>tr ≈ 2.2·R·C (rise slow, fall fast)</li><li>R ≥ VCC/I_sink; R ≤ tr(max)/(2.2·C)</li><li>Internal pull-ups ≈ 20–50 kΩ: too weak for fast lines</li></ul>`],
 ['Power',`<table><tr><th></th><th>Linear</th><th>Buck</th></tr><tr><td>Heat</td><td>(Vin − Vout)·I</td><td>≈ 5–15% of Pout</td></tr><tr><td>Efficiency</td><td>Vout/Vin</td><td>85–95%</td></tr><tr><td>Noise</td><td>quiet</td><td>switching ripple</td></tr><tr><td>Formula</td><td>Vin ≥ Vout + dropout</td><td>Vout = D·Vin</td></tr></table><ul><li>Iin(buck) = Vout·Iout/(η·Vin)</li><li>Bench supply CC light = current limit hit</li></ul>`],

const EXPORT_VARS='--paper:#FFFFFF;--grid:#E3E9EF;--grid2:#CCD8E3;--ink:#1C2B3A;--ink2:#566778;--line:#BCC9D5;--probe:#C8202A;--hl:#B3DFF7;--ok:#1E7A55;--okbg:#E1F2E9;--badbg:#FBE6E6;--panel:#FFFFFF';
function svgMarkup(svg){
 const holder=document.createElement('div');holder.style.cssText=EXPORT_VARS+';position:fixed;left:-10000px;top:0;';
 const c=svg.cloneNode(true);holder.appendChild(c);document.body.appendChild(holder);
 c.querySelectorAll('.hit,.whit').forEach(e=>e.remove());
 const vb=c.viewBox.baseVal;c.setAttribute('width',vb.width);c.setAttribute('height',vb.height);c.setAttribute('xmlns','http://www.w3.org/2000/svg');
 const props=['fill','stroke','stroke-width','stroke-dasharray','stroke-linecap','stroke-linejoin','font-size','font-family','font-weight','opacity','display','text-anchor'];
 [c,...c.querySelectorAll('*')].forEach(el=>{const cs=getComputedStyle(el);el.setAttribute('style',props.map(k=>`${k}:${cs.getPropertyValue(k)}`).join(';'));});
 const xml=new XMLSerializer().serializeToString(c);holder.remove();return{xml,w:vb.width,h:vb.height};}
function svgPng(svg,scale=3){const{xml,w,h}=svgMarkup(svg);return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png');}catch(e){rej(e);}};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);});}
const slug=s=>(s||'circuit').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'circuit';
function downloadBlob(b,name){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
const canShareFiles=(()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File([''],'x.png',{type:'image/png'})]}));}catch(e){return false;}})();
function attachTools(root,name){if(typeof document==='undefined')return;root.querySelectorAll('.sheet').forEach(sh=>{if(sh.querySelector(':scope>.sheet-tools'))return;const svg=sh.querySelector('svg');if(!svg)return;

 t.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;const s=sh.querySelector('svg'),fn=slug(sh.dataset.name||name)+'.png';
  try{if(a==='copy'){await navigator.clipboard.write([new ClipboardItem({'image/png':svgPng(s)})]);toast('Copied. Paste it into your notes.');}
